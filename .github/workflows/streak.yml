name: Daily Commit

on:
  schedule:
    - cron: '0 15 * * *'   # 15:00 UTC daily — adjust as needed
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git identity
        run: |
          git config user.name "Myselfsooraj"
          git config user.email "190881650+Myselfsooraj@users.noreply.github.com"

      - name: Make random number of commits
        run: |
          COUNT=$(( (RANDOM % 7) + 8 ))   # random number between 8 and 14
          echo "Making $COUNT commits today"
          for i in $(seq 1 $COUNT); do
            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - update #$i" >> streak-log.txt
            git add streak-log.txt
            git commit -m "chore: automated update #$i"
          done

      - name: Push all commits
        run: git push