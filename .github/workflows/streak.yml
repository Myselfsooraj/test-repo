name: Daily Commit

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update log
        run: echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> streak-log.txt

      - name: Commit and push
        run: |
          git config user.name "Myselfsooraj"
          git config user.email "190881650+Myselfsooraj@users.noreply.github.com"
          git add streak-log.txt
          git commit -m "chore: automated daily update" || echo "No changes to commit"
          git push
